    <path d="M-24-44l14 16 30-34" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-70" y="56" width="140" height="16" rx="8" fill="url(#accent)" opacity=".85"/>
    <path d="M-118 84v40h236v-40" fill="none" stroke="url(#accent-2)" stroke-width="4" opacity=".5"/>
