  <text x="60" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="20" letter-spacing="6" fill="#e6e7ea">DJ · PHOTOGRAPHY · VIDEO</text>
  <text x="60" y="564" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#f5f5f5">Creative Media</text>
