<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t">
  <title id="t">DJ and media production cover</title>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101214" stop-opacity=".48"/>
      <stop offset=".58" stop-color="#101214" stop-opacity=".38"/>
      <stop offset="1" stop-color="#101214" stop-opacity=".82"/>
