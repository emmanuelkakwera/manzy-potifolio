    <circle cx="96" cy="0" r="92" fill="#1d2025" stroke="url(#accent)" stroke-width="5"/>
    <circle cx="96" cy="0" r="20" fill="url(#accent-2)"/>
    <circle cx="96" cy="0" r="44" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".5"/>
    <path d="M-58-92v-26M-58 92v26M96-92v-26M96 92v26" stroke="url(#accent-2)" stroke-width="5" stroke-linecap="round"/>
    <path d="M-160 0h-52M208 0h52" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity=".55"/>
